<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瓦城年度巡檢戰情地圖 v1.9｜年度巡檢進度系統</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Leaflet 1.9.4 標準 CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 載入 Google Fonts: Inter 與 Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* 強制設定滿版視窗高度 (100dvh)，防止預覽視窗與行動裝置高度塌陷 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }

        /* 響應式主容器：手機版上下分欄，桌面版左右雙欄 */
        .app-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100dvh;
        }

        /* 手機版 (< 768px)：上方地圖 46dvh，下方控制面板 54dvh */
        .map-wrapper {
            width: 100%;
            height: 46dvh;
            min-height: 250px;
            position: relative;
            background-color: #e2e8f0;
            order: 1;
        }

        .sidebar-wrapper {
            width: 100%;
            height: 54dvh;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            border-top: 1px solid #cbd5e1;
            z-index: 20;
            order: 2;
        }

        /* 桌面版 (>= 768px)：左側邊欄 415px，右側滿版地圖 100dvh */
        @media (min-width: 768px) {
            .app-shell {
                flex-direction: row;
            }
            .sidebar-wrapper {
                width: 415px;
                min-width: 415px;
                height: 100dvh;
                border-top: none;
                border-right: 1px solid #cbd5e1;
                order: 1;
            }
            .map-wrapper {
                flex: 1;
                height: 100dvh;
                min-height: 450px;
                order: 2;
            }
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 自訂 Leaflet DivIcon 狀態燈號膠囊標記 */
        .custom-store-icon {
            background: transparent;
            border: none;
        }

        .store-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 9999px;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.02em;
            white-space: nowrap;
            border: 2px solid #ffffff;
            box-shadow: 0 3px 8px rgba(15, 23, 42, 0.35);
            transform: translate(-50%, -100%);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s ease;
            cursor: pointer;
            position: relative;
        }

        /* 滑鼠懸停時的「店號 + 店名」浮動提示框樣式 */
        .leaflet-tooltip.store-hover-tooltip {
            background-color: rgba(15, 23, 42, 0.95);
            color: #ffffff;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 5px 10px;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.3);
            white-space: nowrap;
        }

        .leaflet-tooltip-top.store-hover-tooltip::before {
            border-top-color: rgba(15, 23, 42, 0.95);
        }

        /* 標記底部箭頭指標 */
        .store-badge::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 4px 0;
            border-style: solid;
            border-color: #ffffff transparent transparent transparent;
        }

        .store-badge:hover {
            transform: translate(-50%, -110%) scale(1.1);
            z-index: 950 !important;
        }

        /* 今日排程呼吸脈衝效果 */
        @keyframes amberPulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.85), 0 3px 10px rgba(15, 23, 42, 0.36); }
            70% { box-shadow: 0 0 0 11px rgba(245, 158, 11, 0), 0 3px 10px rgba(15, 23, 42, 0.36); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0), 0 3px 10px rgba(15, 23, 42, 0.36); }
        }

        .store-badge.today-pulse {
            animation: amberPulse 1.8s infinite;
        }

        /* 選中時的高亮縮放 */
        .store-badge.selected {
            transform: translate(-50%, -115%) scale(1.16);
            outline: 2.5px solid #0f172a;
            z-index: 1000 !important;
        }

        /* Leaflet 彈出視窗美化 */
        .leaflet-popup-content-wrapper {
            border-radius: 14px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 12px 28px -5px rgba(15, 23, 42, 0.28);
            border: 1px solid #e2e8f0;
        }

        .leaflet-popup-content {
            margin: 0;
            width: 300px !important;
        }

        .leaflet-container a.leaflet-popup-close-button {
            color: #ffffff;
            top: 9px;
            right: 9px;
            width: 24px;
            height: 24px;
            line-height: 24px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            text-align: center;
            font-size: 16px;
        }

        .leaflet-container a.leaflet-popup-close-button:hover {
            background: rgba(0, 0, 0, 0.45);
            color: #ffffff;
        }

        /* 覆寫 Leaflet 預設 .leaflet-container a 連結藍色，確保小圖卡導航按鈕文字為純白色 */
        .leaflet-container a.gmaps-nav-btn,
        .leaflet-container a.gmaps-nav-btn:hover,
        .leaflet-container a.gmaps-nav-btn:visited {
            color: #ffffff !important;
        }

        /* 自訂捲軸 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- 左側（手機版下方）：戰情統計儀表板與門店進度清單 -->
        <aside class="sidebar-wrapper shadow-xl">
            <!-- 1. 頂部標題列與系統基準日 -->
            <div class="p-3 bg-slate-900 text-white shrink-0 border-b border-slate-800">
                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2 min-w-0">
                        <!-- 瓦城官方品牌識別 LOGO（正紅底色 + 白色圓潤筆觸「瓦城 THAI TOWN」） -->
                        <div class="w-9 h-9 rounded-xl bg-[#D90B17] border border-red-400/40 flex items-center justify-center shrink-0 shadow-md overflow-hidden" title="瓦城 THAI TOWN">
                            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 100 100" class="w-full h-full">
                                <rect width="100" height="100" fill="#D90B17"/>
                                <g fill="none" stroke="#FFFFFF" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M16 33 Q28 31 40 28"/>
                                    <path d="M23 33 L18 55 C17 61 21 63 26 59 L34 52"/>
                                    <path d="M20 43 C27 40 34 42 34 49 C34 56 38 61 45 59"/>
                                    <path d="M47 41 L57 39"/>
                                    <path d="M52 30 L52 55"/>
                                    <path d="M46 57 L58 51"/>
                                    <path d="M59 35 L82 31"/>
                                    <path d="M62 35 L61 48 C61 55 58 60 54 63"/>
                                    <path d="M62 45 L71 43 C73 43 73 46 72 51 C71 55 68 56 66 54"/>
                                    <path d="M67 24 C71 39 76 53 84 61"/>
                                    <path d="M83 41 C79 50 72 57 63 62"/>
                                </g>
                                <circle cx="26.5" cy="49.5" r="2.6" fill="#FFFFFF"/>
                                <circle cx="77" cy="23.5" r="3.2" fill="#FFFFFF"/>
                                <text x="50" y="79" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="13.5" letter-spacing="0.8">THAI TOWN</text>
                            </svg>
                        </div>
                        <div class="min-w-0">
                            <h1 class="text-[13px] font-extrabold tracking-tight truncate">瓦城年度巡檢戰情地圖 v1.9</h1>
                            <p id="today-date-label" class="text-[10.5px] text-slate-400 font-mono truncate">今日基準：載入中...</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <!-- 重新同步雲端按鈕 -->
                        <button id="btn-sync-cloud" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-sky-300 text-[11px] font-semibold border border-slate-700 transition cursor-pointer" title="從雲端試算表重新抓回最新進度">
                            🔄
                        </button>
                        <!-- 管理員權限切換按鈕 -->
                        <button id="btn-admin-toggle" class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-300 text-[11px] font-bold border border-amber-500/40 transition cursor-pointer" title="工程師唯讀模式／點擊解鎖管理員編輯">
                            🔒 唯讀
                        </button>
                        <!-- 僅管理員解鎖後顯示：變更管理密碼 -->
                        <button id="btn-change-pwd" class="hidden px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-200 text-[11px] font-semibold border border-amber-500/40 transition cursor-pointer" title="變更雲端管理員密碼">
                            🔑 改密碼
                        </button>
                        <!-- 僅管理員解鎖後顯示：匯入 CSV -->
                        <input type="file" id="input-import-csv" accept=".csv" class="hidden" />
                        <button id="btn-import-csv" class="hidden px-2 py-1.5 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white text-[11px] font-semibold border border-emerald-500/60 transition cursor-pointer" title="匯入進度 CSV 並同步寫入雲端">
                            匯入
                        </button>
                        <button id="btn-export-csv" class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-semibold border border-slate-700 transition cursor-pointer" title="匯出目前進度 CSV 報表">
                            匯出
                        </button>
                    </div>
                </div>

                <!-- 通知橫幅（取代 alert） -->
                <div id="toast-banner" class="hidden mt-2 px-3 py-1.5 rounded-lg text-[11px] font-bold flex items-center justify-between transition">
                    <span id="toast-message"></span>
                    <button onclick="document.getElementById('toast-banner').classList.add('hidden')" class="ml-2 opacity-75 hover:opacity-100 cursor-pointer">✕</button>
                </div>

                <!-- 2. 雙軌進度率統計條（上方：已完成率雙色條 [左已登錄/右已完成] / 下方：未完成率雙色條 [左未排程/右今日排程]） -->
                <div class="mt-2.5 p-2.5 rounded-xl bg-slate-800/85 border border-slate-700/80 space-y-2">
                    <!-- 上方色條：已完成狀態（已登錄 + 已完成，依實際佔比等比例顯示） -->
                    <div id="group-complete-box" class="cursor-pointer rounded-lg p-1.5 -m-1 hover:bg-slate-700/50 transition" title="點擊在地圖上篩選所有已達成門店">
                        <div class="flex justify-between items-center text-[11px] mb-1">
                            <span class="text-slate-200 font-bold">已完成進度（已登錄 ＋ 已完成）</span>
                            <span id="stat-complete-rate" class="font-mono font-extrabold text-emerald-400">已完成率 0%</span>
                        </div>
                        <div class="w-full h-2.5 bg-slate-900/90 rounded-full overflow-hidden flex border border-slate-700/60">
                            <div id="bar-logged" class="h-full transition-all duration-300" style="width: 0%; background-color: #2563EB;" title="已線上登錄"></div>
                            <div id="bar-completed" class="h-full transition-all duration-300" style="width: 0%; background-color: #10B981;" title="已完成"></div>
                        </div>
                        <div id="sub-complete" class="text-[10px] text-slate-300 mt-1 flex items-center justify-between">
                            <span>計算中...</span>
                            <span class="text-slate-400 underline">篩選分布</span>
                        </div>
                    </div>

                    <div class="border-t border-slate-700/70"></div>

                    <!-- 下方色條：未完成狀態（未排程 + 今日排程，依實際佔比等比例顯示） -->
                    <div id="group-incomplete-box" class="cursor-pointer rounded-lg p-1.5 -m-1 hover:bg-slate-700/50 transition" title="點擊在地圖上篩選所有待完成門店">
                        <div class="flex justify-between items-center text-[11px] mb-1">
                            <span class="text-slate-200 font-bold">未完成進度（未排程 ＋ 今日排程）</span>
                            <span id="stat-incomplete-rate" class="font-mono font-extrabold text-amber-400">未完成率 0%</span>
                        </div>
                        <div class="w-full h-2.5 bg-slate-900/90 rounded-full overflow-hidden flex border border-slate-700/60">
                            <div id="bar-unscheduled" class="h-full transition-all duration-300" style="width: 0%; background-color: #64748B;" title="未排程"></div>
                            <div id="bar-today" class="h-full transition-all duration-300" style="width: 0%; background-color: #F59E0B;" title="今日排程"></div>
                        </div>
                        <div id="sub-incomplete" class="text-[10px] text-slate-300 mt-1 flex items-center justify-between">
                            <span>計算中...</span>
                            <span class="text-slate-400 underline">篩選分布</span>
                        </div>
                    </div>
                </div>

                <!-- 3. 四色進度燈號即時統計與篩選卡 -->
                <div class="grid grid-cols-4 gap-1.5 mt-2" id="status-filter-grid">
                    <button data-status="UNSCHEDULED" class="status-card p-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-center transition cursor-pointer">
                        <div class="flex items-center justify-center gap-1 text-[10px] text-slate-300 font-medium">
                            <span class="w-2 h-2 rounded-full bg-slate-400"></span>未排程
                        </div>
                        <div id="count-unscheduled" class="text-sm font-mono font-extrabold text-white mt-0.5">0</div>
                    </button>
                    <button data-status="TODAY" class="status-card p-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-amber-500/40 text-center transition cursor-pointer">
                        <div class="flex items-center justify-center gap-1 text-[10px] text-amber-300 font-bold">
                            <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>今日排程
                        </div>
                        <div id="count-today" class="text-sm font-mono font-extrabold text-amber-400 mt-0.5">0</div>
                    </button>
                    <button data-status="COMPLETED" class="status-card p-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-emerald-500/40 text-center transition cursor-pointer">
                        <div class="flex items-center justify-center gap-1 text-[10px] text-emerald-300 font-medium">
                            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>已完成
                        </div>
                        <div id="count-completed" class="text-sm font-mono font-extrabold text-emerald-400 mt-0.5">0</div>
                    </button>
                    <button data-status="LOGGED" class="status-card p-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-blue-500/40 text-center transition cursor-pointer">
                        <div class="flex items-center justify-center gap-1 text-[10px] text-blue-300 font-medium">
                            <span class="w-2 h-2 rounded-full bg-blue-400"></span>已登錄
                        </div>
                        <div id="count-logged" class="text-sm font-mono font-extrabold text-blue-400 mt-0.5">0</div>
                    </button>
                </div>

                <!-- 4. 搜尋框與行政區下拉篩選 -->
                <div class="grid grid-cols-5 gap-1.5 mt-2">
                    <div class="col-span-3 relative">
                        <input id="search-input" type="text" placeholder="搜尋店號或店名..."
                               class="w-full pl-7 pr-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500" />
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-slate-400 absolute left-2 top-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <select id="district-select" class="col-span-2 px-2 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white focus:outline-none focus:border-emerald-500 cursor-pointer">
                        <option value="ALL">全部行政區 (83)</option>
                    </select>
                </div>

                <!-- 5. 品牌快速篩選膠囊列 -->
                <div id="brand-filter-bar" class="flex items-center gap-1.5 mt-2 overflow-x-auto pb-0.5">
                    <!-- 由 JavaScript 動態生成 -->
                </div>

                <!-- 篩選重置提示列 -->
                <div id="active-filter-bar" class="hidden mt-1.5 pt-1.5 border-t border-slate-800 flex items-center justify-between text-xs">
                    <span id="active-filter-text" class="text-amber-300 font-medium truncate">篩選中</span>
                    <button id="btn-clear-filter" class="text-slate-300 hover:text-white underline text-[11px] shrink-0 ml-2 cursor-pointer">顯示全部 (83)</button>
                </div>
            </div>

            <!-- 6. 門店進度卡片清單容器 -->
            <div id="store-list" class="flex-1 overflow-y-auto p-3 space-y-2.5 bg-slate-50">
                <!-- 由 JavaScript 動態生成 -->
            </div>

            <!-- 底部圖資與雲端同步狀態提示 -->
            <div class="px-3.5 py-2 bg-white border-t border-slate-200 text-[11px] text-slate-500 flex items-center justify-between shrink-0">
                <span>底圖：NLSC 臺灣通用電子地圖</span>
                <span id="save-indicator" class="text-sky-600 font-semibold flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-sky-500 animate-pulse"></span>連線雲端資料庫...
                </span>
            </div>
        </aside>

        <!-- 右側（手機版上方）：互動地圖容器 -->
        <main class="map-wrapper">
            <div id="map"></div>

            <!-- 右上角浮動按鈕：總覽全部門店 -->
            <button id="btn-fit-bounds" class="absolute top-3 right-3 z-[1000] bg-slate-900/95 hover:bg-slate-800 text-white px-3.5 py-2 rounded-xl shadow-lg border border-slate-700 text-xs font-bold flex items-center gap-1.5 backdrop-blur-sm transition active:scale-95 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
                <span>總覽篩選門店</span>
            </button>

            <!-- 左下角四色燈號圖例懸浮卡 -->
            <div class="hidden sm:flex absolute bottom-3 left-3 z-[1000] bg-white/95 backdrop-blur-sm px-3.5 py-2 rounded-xl shadow-md border border-slate-200 text-[11px] text-slate-700 items-center gap-3.5">
                <span class="font-bold text-slate-800">燈號圖例：</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-[#64748B]"></span>未排程</span>
                <span class="flex items-center gap-1 font-bold text-amber-700"><span class="w-2.5 h-2.5 rounded-full bg-[#F59E0B]"></span>今日排程</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-[#10B981]"></span>已完成</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-[#2563EB]"></span>已線上登錄</span>
            </div>
        </main>
    </div>

    <!-- 管理員密碼驗證登入視窗 (Modal) -->
    <div id="admin-modal" class="hidden fixed inset-0 z-[2000] bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-xs overflow-hidden">
            <div class="px-4 py-3 bg-slate-900 text-white flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-base">🔐</span>
                    <h2 class="text-sm font-extrabold">管理員編輯權限解鎖</h2>
                </div>
                <button id="btn-close-admin-modal" class="text-slate-400 hover:text-white text-sm cursor-pointer">✕</button>
            </div>
            <div class="p-4 space-y-3">
                <p class="text-xs text-slate-600 leading-relaxed">
                    工程師預設為<b class="text-slate-800">唯讀檢視模式</b>。輸入管理員密碼並經雲端驗證通過後，即可解鎖排程設定、完工切換與雲端同步功能。
                </p>
                <div>

        // ==========================================
        // 4. 狀態管理：本地快取 + Google 試算表雲端雙向同步
        // ==========================================
        function loadLocalFallbackState() {
            try {
                let raw = localStorage.getItem(STORAGE_KEY);
                if (!raw && Array.isArray(PREV_STORAGE_KEYS)) {
                    for (const prevKey of PREV_STORAGE_KEYS) {
                        const prevRaw = localStorage.getItem(prevKey);
                        if (prevRaw) {
                            raw = prevRaw;
                            localStorage.setItem(STORAGE_KEY, prevRaw);
                            break;
                        }
                    }
                }
                if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STORES));
                const savedMap = JSON.parse(raw);
                return DEFAULT_STORES.map(base => {
                    if (savedMap[base.id]) {
                        return {
                            ...base,
                            scheduledDate: savedMap[base.id].scheduledDate !== undefined ? savedMap[base.id].scheduledDate : base.scheduledDate,
                            manualStatus: savedMap[base.id].manualStatus || base.manualStatus || 'UNSCHEDULED'
                        };
                    }
                    return { ...base };
                });
            } catch (e) {
                console.warn('讀取本地快取失敗，使用預設狀態:', e);
                return JSON.parse(JSON.stringify(DEFAULT_STORES));
            }
        }

        function saveLocalCache() {
            try {
                const stateMap = {};
                storesData.forEach(s => {
                    stateMap[s.id] = {
                        scheduledDate: s.scheduledDate,
                        manualStatus: s.manualStatus
                    };
                });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(stateMap));
            } catch (e) {
                console.error('寫入本地快取失敗:', e);
            }
        }

        let storesData = loadLocalFallbackState();

        function setSyncIndicator(type, text) {
            const indicator = document.getElementById('save-indicator');
            if (!indicator) return;
            if (type === 'syncing') {
                indicator.className = 'text-sky-600 font-semibold flex items-center gap-1';
                indicator.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-sky-500 animate-ping"></span>${text}`;
            } else if (type === 'ok') {
                indicator.className = 'text-emerald-600 font-semibold flex items-center gap-1';
                indicator.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>${text}`;
            } else {
                indicator.className = 'text-amber-600 font-semibold flex items-center gap-1';
                indicator.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>${text}`;
            }
        }

        // 從 Google 試算表抓取全隊共用進度
        async function fetchCloudProgress(silent = false) {
            if (!CLOUD_API_URL) return;
            setSyncIndicator('syncing', '同步雲端資料中...');
            try {
                const res = await fetch(`${CLOUD_API_URL}?action=read&_t=${Date.now()}`, {
                    method: 'GET',
                    redirect: 'follow'
                });
                const json = await res.json();
                if (json && json.success && json.records) {
                    const recordKeys = Object.keys(json.records);
                    if (recordKeys.length > 0) {
                        storesData = DEFAULT_STORES.map(base => {
                            const rec = json.records[base.id];
                            if (rec) {
                                const cleanDate = /^\d{4}-\d{2}-\d{2}$/.test(rec.scheduledDate) ? rec.scheduledDate : '';
                                const validStatuses = ['UNSCHEDULED', 'COMPLETED', 'LOGGED'];
                                const cleanStatus = validStatuses.includes(rec.manualStatus) ? rec.manualStatus : 'UNSCHEDULED';
                                return {
                                    ...base,
                                    scheduledDate: cleanDate,
                                    manualStatus: cleanStatus
                                };
                            }
                            return { ...base };
                        });
                        saveLocalCache();
                        renderAll();
                        refreshOpenPopup();
                        const timeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false });
                        setSyncIndicator('ok', `雲端已同步 (${timeStr})`);
                        if (!silent) showToast('已從雲端試算表同步最新進度！', true);
                    } else {
                        saveLocalCache();
                        renderAll();
                        setSyncIndicator('ok', '雲端連線正常（使用基準清冊）');
                        if (isAdminMode) {
                            await syncAllStoresToCloud(true);
                        }
                    }
                }
            } catch (err) {
                console.warn('讀取雲端進度失敗，切換為本地快取模式:', err);
                setSyncIndicator('warn', '離線快取模式');
                if (!silent) showToast('雲端連線逾時，目前顯示本機快取進度。', false);
            }
        }

        // 管理員單店即時寫入 Google 試算表
        async function pushSingleStoreToCloud(store) {
            if (!isAdminMode || !adminPassword) return;
            setSyncIndicator('syncing', `寫入 ${store.id} 至雲端...`);
            try {
                const res = await fetch(CLOUD_API_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'updateOne',
                        password: adminPassword,
                        store: {
                            id: store.id,
                            name: store.name,
                            scheduledDate: store.scheduledDate,
                            manualStatus: store.manualStatus
                        }
                    })
                });
                const json = await res.json();
                if (json && json.success) {
                    const timeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false });
                    setSyncIndicator('ok', `雲端已儲存 (${timeStr})`);
                } else {
                    setSyncIndicator('warn', '雲端寫入遭拒');
                    showToast(`雲端同步失敗：${(json && json.error) || '密碼驗證未通過'}`, false);
                }
            } catch (err) {
                console.error('單店寫入雲端錯誤:', err);
                setSyncIndicator('warn', '雲端寫入失敗');
                showToast('網路連線異常，變更已暫存本機，請稍後重試。', false);
            }
        }

        // 管理員整批同步 83 店至 Google 試算表
        async function syncAllStoresToCloud(isInit = false) {
            if (!isAdminMode || !adminPassword) return false;
            setSyncIndicator('syncing', '整批寫入雲端試算表...');
            try {
                const res = await fetch(CLOUD_API_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'syncAll',
                        password: adminPassword,
                        stores: storesData.map(s => ({
                            id: s.id,
                            name: s.name,
                            scheduledDate: s.scheduledDate,
                            manualStatus: s.manualStatus
                        }))
                    })
                });
                const json = await res.json();
                if (json && json.success) {
                    const timeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false });
                    setSyncIndicator('ok', `全區 ${json.updatedCount} 店已同步 (${timeStr})`);
                    if (isInit) {
                        showToast('已自動將 83 間門店最新進度寫入雲端試算表！', true);
                    }
                    return true;
                } else {
                    setSyncIndicator('warn', '雲端整批同步失敗');
                    showToast(`雲端寫入失敗：${(json && json.error) || '權限驗證失敗'}`, false);
                    return false;
                }
            } catch (err) {
                console.error('整批同步錯誤:', err);
                setSyncIndicator('warn', '雲端整批同步錯誤');
                showToast('無法連線至雲端試算表，請檢查網路狀態。', false);
                return false;
            }
        }

        // 核心燈號判定函式
        function resolveStoreStatus(store) {
            if (store.manualStatus === 'LOGGED') return STATUS_META.LOGGED;
            if (store.manualStatus === 'COMPLETED') return STATUS_META.COMPLETED;
            if (store.scheduledDate && store.scheduledDate === TODAY_STR) {
                return STATUS_META.TODAY;
            }
            return STATUS_META.UNSCHEDULED;
        }

        // ==========================================
        // 5. 全域地圖、篩選、管理員驗證與變更密碼介面控制
        // ==========================================
        let map = null;
        let markersMap = {};
        let selectedStoreId = null;
        let isProgrammaticFlyTo = false;
        let statusFilter = 'ALL';
        let brandFilter = 'ALL';
        let districtFilter = 'ALL';
        let searchQuery = '';

        function updateAdminUI() {
            const btnAdmin = document.getElementById('btn-admin-toggle');
            const btnChangePwd = document.getElementById('btn-change-pwd');
            const btnImport = document.getElementById('btn-import-csv');

        function refreshOpenPopup() {

        function openAdminLoginModal() {
            const modal = document.getElementById('admin-modal');
            const input = document.getElementById('admin-pwd-input');
            const errEl = document.getElementById('admin-modal-error');
            if (!modal || !input) return;
            errEl.classList.add('hidden');
            input.value = '';
            modal.classList.remove('hidden');
            setTimeout(() => input.focus(), 50);
        }

        function closeAdminLoginModal() {
            const modal = document.getElementById('admin-modal');
            if (modal) modal.classList.add('hidden');
        }

        async function verifyAndUnlockAdmin() {
            const input = document.getElementById('admin-pwd-input');
            const errEl = document.getElementById('admin-modal-error');
            const btnSubmit = document.getElementById('btn-submit-admin');
            if (!input || !btnSubmit) return;

            const pwd = input.value.trim();
            if (!pwd) {
                errEl.textContent = '請輸入管理員密碼。';
                errEl.classList.remove('hidden');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.textContent = '驗證中...';
            errEl.classList.add('hidden');

            try {
                const res = await fetch(`${CLOUD_API_URL}?action=verify&pwd=${encodeURIComponent(pwd)}&_t=${Date.now()}`, {
                    method: 'GET',
                    redirect: 'follow'
                });
                const json = await res.json();
                if (json && json.success) {
                    adminPassword = pwd;
                    isAdminMode = true;
                    sessionStorage.setItem(ADMIN_PWD_SESSION_KEY, pwd);
                    closeAdminLoginModal();
                    updateAdminUI();
                    showToast('管理員驗證通過！已解鎖排程與進度編輯權限。', true);

                    const checkRes = await fetch(`${CLOUD_API_URL}?action=read&_t=${Date.now()}`, { redirect: 'follow' });
                    const checkJson = await checkRes.json();
                    if (checkJson && checkJson.success && checkJson.records && Object.keys(checkJson.records).length === 0) {
                        await syncAllStoresToCloud(true);
                    }
                } else {
                    errEl.textContent = (json && json.message) ? json.message : '管理員密碼錯誤，請重新輸入。';
                    errEl.classList.remove('hidden');
                }
            } catch (err) {
                console.error('驗證錯誤:', err);
                errEl.textContent = '無法連線至驗證伺服器，請檢查網路狀態。';
                errEl.classList.remove('hidden');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = '驗證並解鎖';
            }
        }

        function openChangePwdModal() {
            if (!isAdminMode) {
                openAdminLoginModal();

            }
            const modal = document.getElementById('change-pwd-modal');
            const oldInput = document.getElementById('old-pwd-input');
            const newInput = document.getElementById('new-pwd-input');
            const confirmInput = document.getElementById('confirm-pwd-input');
            const errEl = document.getElementById('changepwd-modal-error');
            if (!modal || !oldInput) return;
            errEl.classList.add('hidden');
            oldInput.value = '';
            newInput.value = '';
            confirmInput.value = '';
            modal.classList.remove('hidden');

        function closeChangePwdModal() {
            const modal = document.getElementById('change-pwd-modal');

        }

        async function submitChangeAdminPassword() {
            const oldInput = document.getElementById('old-pwd-input');
            const newInput = document.getElementById('new-pwd-input');
            const confirmInput = document.getElementById('confirm-pwd-input');
            const errEl = document.getElementById('changepwd-modal-error');
            const btnSubmit = document.getElementById('btn-submit-changepwd');
            if (!oldInput || !newInput || !confirmInput || !btnSubmit) return;

            const oldPwd = oldInput.value.trim();
            const newPwd = newInput.value.trim();
            const confirmPwd = confirmInput.value.trim();

            if (!oldPwd || !newPwd || !confirmPwd) {
                errEl.textContent = '請完整填寫舊密碼與新密碼欄位。';
                errEl.classList.remove('hidden');
                return;
            }
            if (newPwd.length < 4) {
                errEl.textContent = '新密碼長度至少需要 4 個字元。';
                errEl.classList.remove('hidden');
                return;
            }
            if (newPwd !== confirmPwd) {
                errEl.textContent = '兩次輸入的新密碼不一致，請重新確認。';
                errEl.classList.remove('hidden');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.textContent = '更新中...';
            errEl.classList.add('hidden');

            try {
                const res = await fetch(CLOUD_API_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'changePassword',
                        password: oldPwd,
                        newPassword: newPwd
                    })
                });
                const json = await res.json();
                if (json && json.success) {
                    adminPassword = newPwd;
                    sessionStorage.setItem(ADMIN_PWD_SESSION_KEY, newPwd);
                    closeChangePwdModal();
                    showToast('雲端管理員密碼已成功更新！', true);
                } else {
                    errEl.textContent = (json && json.error) ? json.error : '舊密碼驗證錯誤，無法變更密碼。';
                    errEl.classList.remove('hidden');
                }
            } catch (err) {
                console.error('變更密碼失敗:', err);
                errEl.textContent = '連線至雲端伺服器失敗，請稍後再試。';
                errEl.classList.remove('hidden');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = '確認更新密碼';
            }
        }

        // ==========================================
        // 10. 動態推算對應星期幾之營業時間
        // ==========================================
        function getTargetHoursInfo(store, statusMeta) {
            let refDateStr = TODAY_STR;
            let basisTag = '今日';

            if (statusMeta.key === 'COMPLETED' || statusMeta.key === 'LOGGED') {
                if (store.scheduledDate && /^\d{4}-\d{2}-\d{2}$/.test(store.scheduledDate)) {
                    refDateStr = store.scheduledDate;
                    basisTag = '完成日';
                }
            } else if (store.scheduledDate && /^\d{4}-\d{2}-\d{2}$/.test(store.scheduledDate)) {
                refDateStr = store.scheduledDate;
                basisTag = '排程日';
            }

            const [y, m, d] = refDateStr.split('-').map(Number);
            const dateObj = new Date(y, m - 1, d);
            const dayIdx = dateObj.getDay();
            const dayLabel = WEEKDAY_LABELS[dayIdx] || '一';
            const hoursText = (Array.isArray(store.hours) && store.hours[dayIdx]) ? store.hours[dayIdx] : '依商場營業時間';

            return {
                dayLabel,
                hoursText,
                basisTag
            };
        }

        // ==========================================
        // 13. 統計計算與渲染
        // ==========================================
        function updateStatistics() {
            const scopeStores = storesData.filter(s => {
                const matchBrand = brandFilter === 'ALL' || s.brand === brandFilter;
                const matchDistrict = districtFilter === 'ALL' || s.district === districtFilter;
                return matchBrand && matchDistrict;
            });

            const total = scopeStores.length;
            let countUnscheduled = 0;
            let countToday = 0;
            let countCompleted = 0;
            let countLogged = 0;

            scopeStores.forEach(store => {
                const st = resolveStoreStatus(store).key;
                if (st === 'UNSCHEDULED') countUnscheduled++;
                else if (st === 'TODAY') countToday++;
                else if (st === 'COMPLETED') countCompleted++;
                else if (st === 'LOGGED') countLogged++;
            });

            const elUnscheduled = document.getElementById('count-unscheduled');
            const elToday = document.getElementById('count-today');
            const elCompleted = document.getElementById('count-completed');
            const elLogged = document.getElementById('count-logged');

            if (elUnscheduled) elUnscheduled.textContent = countUnscheduled;
            if (elToday) elToday.textContent = countToday;
            if (elCompleted) elCompleted.textContent = countCompleted;
            if (elLogged) elLogged.textContent = countLogged;

            const incompleteTotal = countUnscheduled + countToday;
            const incompleteRate = total > 0 ? Math.round((incompleteTotal / total) * 100) : 0;
            const unscheduledPct = total > 0 ? (countUnscheduled / total) * 100 : 0;
            const todayPct = total > 0 ? (countToday / total) * 100 : 0;

            const elIncRate = document.getElementById('stat-incomplete-rate');
            const elBarUnsch = document.getElementById('bar-unscheduled');
            const elBarToday = document.getElementById('bar-today');
            const elSubInc = document.getElementById('sub-incomplete');

            if (elIncRate) elIncRate.textContent = `未完成率 ${incompleteRate}% (${incompleteTotal}/${total})`;
            if (elBarUnsch) elBarUnsch.style.width = `${unscheduledPct}%`;
            if (elBarToday) elBarToday.style.width = `${todayPct}%`;
            if (elSubInc) {
                elSubInc.innerHTML = `
                    <span>未排程 <b>${countUnscheduled}</b> 間 ＋ 今日排程 <b>${countToday}</b> 間</span>
                    <span class="text-amber-300 underline font-semibold">檢視分布</span>
                `;
            }

            const completeTotal = countCompleted + countLogged;
            const completeRate = total > 0 ? (100 - incompleteRate) : 0;
            const completedPct = total > 0 ? (countCompleted / total) * 100 : 0;
            const loggedPct = total > 0 ? (countLogged / total) * 100 : 0;

            const elCompRate = document.getElementById('stat-complete-rate');
            const elBarComp = document.getElementById('bar-completed');
            const elBarLog = document.getElementById('bar-logged');
            const elSubComp = document.getElementById('sub-complete');

            if (elCompRate) elCompRate.textContent = `已完成率 ${completeRate}% (${completeTotal}/${total})`;
            if (elBarLog) elBarLog.style.width = `${loggedPct}%`;
            if (elBarComp) elBarComp.style.width = `${completedPct}%`;
            if (elSubComp) {
                elSubComp.innerHTML = `
                    <span>已登錄 <b>${countLogged}</b> 間 ＋ 已完成 <b>${countCompleted}</b> 間</span>
                    <span class="text-emerald-300 underline font-semibold">檢視分布</span>
                `;
            }
        }

        // ==========================================
        // 14. 取得目前篩選後的門店清單（五層級優先排序）
        // ==========================================
        function getStorePriorityTier(store) {
            const stKey = resolveStoreStatus(store).key;
            if (stKey === 'TODAY') return 1;
            if (stKey === 'UNSCHEDULED') {
                return (store.scheduledDate && store.scheduledDate.trim() !== '') ? 2 : 3;
            }
            if (stKey === 'COMPLETED') return 4;
            if (stKey === 'LOGGED') return 5;
            return 6;
        }

        function compareStoreIdAsc(idA, idB) {
            return String(idA).localeCompare(String(idB), 'en', { numeric: true, sensitivity: 'base' });
        }

        function getFilteredStores() {
            const q = searchQuery.trim().toLowerCase();
            const filtered = storesData.filter(store => {
                const stKey = resolveStoreStatus(store).key;

                let matchStatus = true;
                if (statusFilter === 'INCOMPLETE_GROUP') {
                    matchStatus = (stKey === 'UNSCHEDULED' || stKey === 'TODAY');
                } else if (statusFilter === 'COMPLETE_GROUP') {
                    matchStatus = (stKey === 'COMPLETED' || stKey === 'LOGGED');
                } else if (statusFilter !== 'ALL') {
                    matchStatus = (stKey === statusFilter);
                }

                const matchBrand = brandFilter === 'ALL' || store.brand === brandFilter;
                const matchDistrict = districtFilter === 'ALL' || store.district === districtFilter;
                const matchSearch = !q ||
                    store.id.toLowerCase().includes(q) ||
                    store.name.toLowerCase().includes(q) ||
                    store.mall.toLowerCase().includes(q) ||
                    (store.address && store.address.toLowerCase().includes(q));

                return matchStatus && matchBrand && matchDistrict && matchSearch;
            });

            return filtered.sort((a, b) => {
                const tierA = getStorePriorityTier(a);
                const tierB = getStorePriorityTier(b);
                if (tierA !== tierB) return tierA - tierB;

                if (tierA === 2 && a.scheduledDate !== b.scheduledDate) {
                    return a.scheduledDate.localeCompare(b.scheduledDate);
                }

                return compareStoreIdAsc(a.id, b.id);
            });
        }

        // ==========================================
        // 15. 渲染地圖標記與左側門店卡片清單
        // ==========================================
        function renderAll() {
            updateStatistics();

            if (!map) return;
            Object.values(markersMap).forEach(marker => map.removeLayer(marker));
            markersMap = {};

            const filteredStores = getFilteredStores();

            const filterBar = document.getElementById('active-filter-bar');
            const filterText = document.getElementById('active-filter-text');
            const hasFilter = statusFilter !== 'ALL' || brandFilter !== 'ALL' || districtFilter !== 'ALL' || searchQuery.trim() !== '';

            if (filterBar && filterText) {
                if (hasFilter) {
                    const labels = [];
                    if (statusFilter === 'INCOMPLETE_GROUP') labels.push('群組：未完成（未排程＋今日排程）');
                    else if (statusFilter === 'COMPLETE_GROUP') labels.push('群組：已完成（已登錄＋已完成）');
                    else if (statusFilter !== 'ALL') labels.push(`燈號：${STATUS_META[statusFilter].label}`);
                    if (districtFilter !== 'ALL') labels.push(`區域：${districtFilter}`);
                    if (brandFilter !== 'ALL') labels.push(`品牌：${brandFilter}`);
                    if (searchQuery.trim() !== '') labels.push(`關鍵字：「${searchQuery.trim()}」`);
                    filterText.textContent = `篩選中 (${filteredStores.length} 間)：${labels.join(' · ')}`;
                    filterBar.classList.remove('hidden');
                } else {
                    filterBar.classList.add('hidden');
                }
            }

            document.querySelectorAll('.status-card').forEach(btn => {
                const key = btn.getAttribute('data-status');
                if (statusFilter === key) {
                    btn.classList.add('ring-2', 'ring-white', 'bg-slate-700');
                } else {
                    btn.classList.remove('ring-2', 'ring-white', 'bg-slate-700');
                }
            });

            const grpInc = document.getElementById('group-incomplete-box');
            const grpComp = document.getElementById('group-complete-box');
            if (grpInc) grpInc.classList.toggle('ring-2', statusFilter === 'INCOMPLETE_GROUP');
            if (grpInc) grpInc.classList.toggle('ring-amber-400', statusFilter === 'INCOMPLETE_GROUP');
            if (grpComp) grpComp.classList.toggle('ring-2', statusFilter === 'COMPLETE_GROUP');
            if (grpComp) grpComp.classList.toggle('ring-emerald-400', statusFilter === 'COMPLETE_GROUP');

            const listContainer = document.getElementById('store-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';

            if (filteredStores.length === 0) {
                listContainer.innerHTML = `
                    <div class="p-8 text-center text-slate-400 text-xs bg-white rounded-2xl border border-dashed border-slate-300">
                        沒有符合目前篩選條件的門店。<br>
                        <button onclick="resetFilters()" class="mt-2 text-emerald-600 font-bold underline cursor-pointer">清除所有篩選條件</button>
                    </div>
                `;
                return;
            }

            filteredStores.forEach(store => {
                const statusMeta = resolveStoreStatus(store);
                const isSelected = store.id === selectedStoreId;
                const fullName = `${store.id} ${store.name}`;

                const marker = L.marker([store.lat, store.lng], {
                    icon: createStoreDivIcon(store, statusMeta, isSelected)
                }).addTo(map);

                marker.bindTooltip(fullName, {
                    direction: 'top',
                    offset: [0, -32],
                    className: 'store-hover-tooltip',
                    opacity: 1
                });

                marker.bindPopup(() => createPopupHTML(store, resolveStoreStatus(store)), {
                    maxWidth: 320,
                    closeButton: true
                });

                marker.on('click', () => {
                    selectStoreOnMap(store.id, false);
                });

                markersMap[store.id] = marker;

                const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${store.lat},${store.lng}`;
                const card = document.createElement('div');
                card.id = `store-card-${store.id}`;
                card.className = `p-3.5 rounded-2xl bg-white border transition-all shadow-sm hover:shadow-md cursor-pointer ${
                    isSelected ? 'border-slate-900 ring-2 ring-slate-900/15' : 'border-slate-200 hover:border-slate-300'
                }`;

                const footerActionHTML = isAdminMode ? `
                    <div class="mt-2.5 pt-2.5 border-t border-slate-100 flex items-center gap-1.5" onclick="event.stopPropagation()">
                        <input type="date" value="${store.scheduledDate}" onchange="updateStoreDate('${store.id}', this.value)"
                               title="設定預計巡檢日期"
                               class="px-2 py-1 rounded-lg border border-slate-300 text-[11px] font-mono text-slate-700 bg-slate-50 focus:bg-white focus:outline-none focus:border-amber-500" />
                        <button onclick="updateStoreManualStatus('${store.id}', 'COMPLETED')"
                                class="px-2 py-1 rounded-lg text-[11px] font-bold border transition cursor-pointer ${store.manualStatus === 'COMPLETED' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-emerald-700 border-emerald-300 hover:bg-emerald-50'}">
                            已完成
                        </button>
                        <button onclick="updateStoreManualStatus('${store.id}', 'LOGGED')"
                                class="px-2 py-1 rounded-lg text-[11px] font-bold border transition cursor-pointer ${store.manualStatus === 'LOGGED' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-blue-700 border-blue-300 hover:bg-blue-50'}">
                            已登錄
                        </button>
                        <a href="${googleMapsUrl}" target="_blank" rel="noopener noreferrer"
                           class="ml-auto px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-blue-600 text-white text-[11px] font-bold flex items-center gap-1 transition shrink-0"
                           title="開啟 Google Maps 導航">
                            <span>導航</span>
                        </a>
                    </div>
                ` : `
                    <div class="mt-2 pt-2 border-t border-slate-100 flex items-center justify-between gap-2 text-[11px] text-slate-500" onclick="event.stopPropagation()">
                        <span class="truncate">📍 ${store.address || `${store.city}${store.district}`}</span>
                        <a href="${googleMapsUrl}" target="_blank" rel="noopener noreferrer"
                           class="px-2.5 py-1 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-bold flex items-center gap-1 transition shrink-0"
                           title="開啟 Google Maps 導航">
                            <span>導航</span>
                        </a>
                    </div>
                `;

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="w-3 h-3 rounded-full shrink-0" style="background-color: ${statusMeta.color};"></span>
                            <h3 class="text-sm font-extrabold text-slate-900 truncate">${fullName}</h3>
                        </div>
                        <span class="px-2 py-0.5 rounded-full text-[11px] font-bold border shrink-0 ${statusMeta.badgeBg}">
                            ${statusMeta.label}
                        </span>
                    </div>

                    <div class="mt-1.5 flex items-center justify-between text-xs text-slate-500 pl-5">
                        <span>${store.city} · ${store.district} · ${store.mall}</span>
                        <span class="font-mono text-[11px] text-slate-600">
                            ${store.scheduledDate ? `排程：${store.scheduledDate}` : '尚未設定日期'}
                        </span>
                    </div>

                    ${footerActionHTML}
                `;

                card.addEventListener('click', () => {
                    selectStoreOnMap(store.id, true);
                });

                listContainer.appendChild(card);
            });
        }

        // ==========================================
        // 16. 地圖定位與標記選取
        // ==========================================
        function selectStoreOnMap(storeId, flyToLocation = true) {
            selectedStoreId = storeId;
            const store = storesData.find(s => s.id === storeId);
            const marker = markersMap[storeId];
            if (!store || !marker) return;

            document.querySelectorAll('.store-badge').forEach(el => el.classList.remove('selected'));
            const iconEl = marker.getElement();
            if (iconEl) {
                const badge = iconEl.querySelector('.store-badge');
                if (badge) badge.classList.add('selected');
            }

            document.querySelectorAll('#store-list > div').forEach(card => {
                card.classList.remove('border-slate-900', 'ring-2', 'ring-slate-900/15');
                card.classList.add('border-slate-200');
            });
            const activeCard = document.getElementById(`store-card-${storeId}`);
            if (activeCard) {
                activeCard.classList.remove('border-slate-200');
                activeCard.classList.add('border-slate-900', 'ring-2', 'ring-slate-900/15');
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            if (flyToLocation) {
                map.stop();
                map.closePopup();

                const targetLatLng = L.latLng(store.lat, store.lng);
                const targetZoom = 16;
                const isAlreadyAtTarget = map.getZoom() === targetZoom && map.getCenter().distanceTo(targetLatLng) < 15;

                if (isAlreadyAtTarget) {
                    isProgrammaticFlyTo = false;
                    marker.openPopup();
                    return;
                }

                isProgrammaticFlyTo = true;
                map.once('moveend', () => {
                    isProgrammaticFlyTo = false;
                    if (selectedStoreId === storeId && markersMap[storeId]) {
                        markersMap[storeId].openPopup();
                    }
                });
                map.flyTo(targetLatLng, targetZoom, { animate: true, duration: 0.65 });
            } else {
                isProgrammaticFlyTo = false;
                marker.openPopup();
            }
        }

        function fitFilteredMarkers() {
            const markers = Object.values(markersMap);
            if (!map || markers.length === 0) return;
            const group = new L.featureGroup(markers);
            map.fitBounds(group.getBounds(), {
                padding: [55, 55],
                maxZoom: 15
            });
        }

        window.resetFilters = function() {
            statusFilter = 'ALL';
            brandFilter = 'ALL';
            districtFilter = 'ALL';
            searchQuery = '';
            const searchInput = document.getElementById('search-input');
            const districtSelect = document.getElementById('district-select');
            if (searchInput) searchInput.value = '';
            if (districtSelect) districtSelect.value = 'ALL';
            renderBrandFilters();
            renderAll();
            fitFilteredMarkers();
        };

        // ==========================================
        // 17. 匯出與匯入進度 CSV 報表
        // ==========================================
        function showToast(message, isSuccess = true) {
            const banner = document.getElementById('toast-banner');
            const msgEl = document.getElementById('toast-message');
            if (!banner || !msgEl) return;
            msgEl.textContent = message;
            banner.className = `mt-2 px-3 py-1.5 rounded-lg text-[11px] font-bold flex items-center justify-between transition ${
                isSuccess
                    ? 'bg-emerald-900/90 text-emerald-200 border border-emerald-600'
                    : 'bg-rose-900/90 text-rose-200 border border-rose-600'
            }`;
            banner.classList.remove('hidden');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                banner.classList.add('hidden');
            }, 4500);
        }

        function exportProgressCSV() {
            const headers = ['門店名稱', '店號', '店名', '品牌', '縣市', '行政區', '商場', '地址', '排程日期', '目前燈號狀態', '緯度', '經度'];
            const rows = storesData.map(s => {
                const stLabel = resolveStoreStatus(s).label;
                return [`${s.id} ${s.name}`, s.id, s.name, s.brand, s.city, s.district, s.mall, s.address || '', s.scheduledDate || '未排程', stLabel, s.lat, s.lng].join(',');
            });
            const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `瓦城年度巡檢戰情地圖_v1.9_${TODAY_STR}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('已成功匯出最新巡檢進度 CSV 報表！', true);
        }

        function importProgressCSV(file) {
            if (!isAdminMode) {
                showToast('僅管理員可匯入並覆寫雲端進度。', false);
                return;
            }
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const text = (e.target.result || '').replace(/^\uFEFF/, '');
                    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                    if (lines.length < 2) {
                        showToast('匯入失敗：CSV 檔案內容為空或格式不正確。', false);
                        return;
                    }

                    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
                    const idxId = headers.indexOf('店號');
                    const idxFullName = headers.indexOf('門店名稱');
                    const idxDate = headers.indexOf('排程日期');
                    const idxStatus = headers.indexOf('目前燈號狀態');

                    if (idxId === -1 && idxFullName === -1) {
                        showToast('匯入失敗：找不到「店號」或「門店名稱」欄位。', false);
                        return;
                    }

                    let updatedCount = 0;
                    for (let i = 1; i < lines.length; i++) {
                        const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
                        let storeId = idxId !== -1 ? cols[idxId] : '';
                        if (!storeId && idxFullName !== -1 && cols[idxFullName]) {
                            storeId = cols[idxFullName].split(/\s+/)[0];
                        }
                        if (!storeId) continue;

                        const targetStore = storesData.find(s => s.id === storeId);
                        if (!targetStore) continue;

                        const rawDate = idxDate !== -1 ? (cols[idxDate] || '') : '';
                        const cleanDate = /^\d{4}-\d{2}-\d{2}$/.test(rawDate) ? rawDate : '';
                        const rawStatus = idxStatus !== -1 ? (cols[idxStatus] || '') : '';

                        targetStore.scheduledDate = cleanDate;
                        if (rawStatus.includes('已登錄')) {
                            targetStore.manualStatus = 'LOGGED';
                        } else if (rawStatus.includes('已完成')) {
                            targetStore.manualStatus = 'COMPLETED';
                        } else {
                            targetStore.manualStatus = 'UNSCHEDULED';
                        }
                        updatedCount++;
                    }

                    if (updatedCount === 0) {
                        showToast('未比對到任何相符店號，請確認 CSV 來源。', false);
                        return;
                    }

                    saveLocalCache();
                    renderAll();
                    fitFilteredMarkers();
                    const cloudOk = await syncAllStoresToCloud(false);
                    if (cloudOk) {
                        showToast(`匯入成功！已同步更新 ${updatedCount} 間門店至雲端試算表。`, true);
                    }
                } catch (err) {
                    console.error('匯入 CSV 解析錯誤:', err);
                    showToast('匯入失敗：CSV 解析發生錯誤。', false);
                } finally {
                    const inputEl = document.getElementById('input-import-csv');
                    if (inputEl) inputEl.value = '';
                }
            };
            reader.readAsText(file, 'UTF-8');
        }

        // ==========================================
        // 18. 事件綁定與雙重啟動保護 (DOMContentLoaded + onload)
        // ==========================================
        let isAppBootstrapped = false;
        function bootstrapApp() {
            if (isAppBootstrapped) return;
            isAppBootstrapped = true;

            const btnFit = document.getElementById('btn-fit-bounds');
            if (btnFit) btnFit.addEventListener('click', fitFilteredMarkers);

            const btnClear = document.getElementById('btn-clear-filter');
            if (btnClear) btnClear.addEventListener('click', window.resetFilters);

            const btnSync = document.getElementById('btn-sync-cloud');
            if (btnSync) btnSync.addEventListener('click', () => fetchCloudProgress(false));

            const btnAdmin = document.getElementById('btn-admin-toggle');
            if (btnAdmin) {
                btnAdmin.addEventListener('click', () => {
                    if (isAdminMode) {
                        isAdminMode = false;
                        adminPassword = '';
                        sessionStorage.removeItem(ADMIN_PWD_SESSION_KEY);
                        updateAdminUI();
                        showToast('已切換回工程師唯讀模式。', true);
                    } else {
                        openAdminLoginModal();
                    }
                });
            }

            const btnCloseModal = document.getElementById('btn-close-admin-modal');
            const btnCancelAdmin = document.getElementById('btn-cancel-admin');
            const btnSubmitAdmin = document.getElementById('btn-submit-admin');
            const pwdInput = document.getElementById('admin-pwd-input');
            if (btnCloseModal) btnCloseModal.addEventListener('click', closeAdminLoginModal);
            if (btnCancelAdmin) btnCancelAdmin.addEventListener('click', closeAdminLoginModal);
            if (btnSubmitAdmin) btnSubmitAdmin.addEventListener('click', verifyAndUnlockAdmin);
            if (pwdInput) {
                pwdInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') verifyAndUnlockAdmin();
                });
            }

            const btnChangePwd = document.getElementById('btn-change-pwd');
            const btnCloseChangePwd = document.getElementById('btn-close-changepwd-modal');
            const btnCancelChangePwd = document.getElementById('btn-cancel-changepwd');
            const btnSubmitChangePwd = document.getElementById('btn-submit-changepwd');
            const confirmPwdInput = document.getElementById('confirm-pwd-input');
            if (btnChangePwd) btnChangePwd.addEventListener('click', openChangePwdModal);
            if (btnCloseChangePwd) btnCloseChangePwd.addEventListener('click', closeChangePwdModal);
            if (btnCancelChangePwd) btnCancelChangePwd.addEventListener('click', closeChangePwdModal);
            if (btnSubmitChangePwd) btnSubmitChangePwd.addEventListener('click', submitChangeAdminPassword);
            if (confirmPwdInput) {
                confirmPwdInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') submitChangeAdminPassword();
                });
            }

            const btnExport = document.getElementById('btn-export-csv');
            if (btnExport) btnExport.addEventListener('click', exportProgressCSV);

            const btnImport = document.getElementById('btn-import-csv');
            const inputImport = document.getElementById('input-import-csv');
            if (btnImport && inputImport) {
                btnImport.addEventListener('click', () => {
                    if (!isAdminMode) {
                        openAdminLoginModal();
                        return;
                    }
                    inputImport.click();
                });
                inputImport.addEventListener('change', (e) => {
                    const file = e.target.files && e.target.files[0];
                    if (file) importProgressCSV(file);
                });
            }

            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    searchQuery = e.target.value;
                    renderAll();
                });
            }

            const districtSelect = document.getElementById('district-select');
            if (districtSelect) {
                districtSelect.addEventListener('change', (e) => {
                    districtFilter = e.target.value;
                    renderAll();
                    fitFilteredMarkers();
                });
            }

            const grpInc = document.getElementById('group-incomplete-box');
            if (grpInc) {
                grpInc.addEventListener('click', () => {
                    statusFilter = (statusFilter === 'INCOMPLETE_GROUP') ? 'ALL' : 'INCOMPLETE_GROUP';
                    renderAll();
                    fitFilteredMarkers();
                });
            }

            const grpComp = document.getElementById('group-complete-box');
            if (grpComp) {
                grpComp.addEventListener('click', () => {
                    statusFilter = (statusFilter === 'COMPLETE_GROUP') ? 'ALL' : 'COMPLETE_GROUP';
                    renderAll();
                    fitFilteredMarkers();
                });
            }

            document.querySelectorAll('.status-card').forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetStatus = btn.getAttribute('data-status');
                    statusFilter = (statusFilter === targetStatus) ? 'ALL' : targetStatus;
                    renderAll();
                    fitFilteredMarkers();
                });
            });

            initializeMap();
        }

        document.addEventListener('DOMContentLoaded', bootstrapApp);
        window.onload = bootstrapApp;

        window.addEventListener('resize', () => {
            if (map) map.invalidateSize();
        });
    </script>
