<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瓦城年度巡檢戰情地圖 v1.8｜年度巡檢進度系統</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Leaflet 1.9.4 標準 CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 載入 Google Fonts: Inter 與 Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100dvh;
        }

        .map-wrapper {
            width: 100%;
            height: 46dvh;
            min-height: 250px;
            position: relative;
            background-color: #e2e8f0;
            order: 1;
        }

        .sidebar-wrapper {
            width: 100%;
            height: 54dvh;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            border-top: 1px solid #cbd5e1;
            z-index: 20;
            order: 2;
        }

        @media (min-width: 768px) {
            .app-shell {
                flex-direction: row;
            }
            .sidebar-wrapper {
                width: 415px;
                min-width: 415px;
                height: 100dvh;
                border-top: none;
                border-right: 1px solid #cbd5e1;
                order: 1;
            }
            .map-wrapper {
                flex: 1;
                height: 100dvh;
                min-height: 450px;
                order: 2;
            }
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .custom-store-icon {
            background: transparent;
            border: none;
        }

        .store-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 9999px;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.02em;
            white-space: nowrap;
            border: 2px solid #ffffff;
            box-shadow: 0 3px 8px rgba(15, 23, 42, 0.35);
            transform: translate(-50%, -100%);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s ease;
            cursor: pointer;
            position: relative;
        }

        .leaflet-tooltip.store-hover-tooltip {
            background-color: rgba(15, 23, 42, 0.95);
            color: #ffffff;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 5px 10px;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.3);
            white-space: nowrap;
        }

        .leaflet-tooltip-top.store-hover-tooltip::before {
            border-top-color: rgba(15, 23, 42, 0.95);
        }

        .store-badge::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 4px 0;
            border-style: solid;
            border-color: #ffffff transparent transparent transparent;
        }

        .store-badge:hover {
            transform: translate(-50%, -110%) scale(1.1);
            z-index: 950 !important;
        }

        @keyframes amberPulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.85), 0 3px 10px rgba(15, 23, 42, 0.36); }
            70% { box-shadow: 0 0 0 11px rgba(245, 158, 11, 0), 0 3px 10px rgba(15, 23, 42, 0.36); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0), 0 3px 10px rgba(15, 23, 42, 0.36); }
        }

        .store-badge.today-pulse {
            animation: amberPulse 1.8s infinite;
        }

        .store-badge.selected {
            transform: translate(-50%, -115%) scale(1.16);
            outline: 2.5px solid #0f172a;
            z-index: 1000 !important;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 14px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 12px 28px -5px rgba(15, 23, 42, 0.28);
            border: 1px solid #e2e8f0;
        }

        .leaflet-popup-content {
            margin: 0;
            width: 300px !important;
        }

        .leaflet-container a.leaflet-popup-close-button {
            color: #ffffff;
            top: 9px;
            right: 9px;
            width: 24px;
            height: 24px;
            line-height: 24px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            text-align: center;
            font-size: 16px;
        }

        .leaflet-container a.leaflet-popup-close-button:hover {
            background: rgba(0, 0, 0, 0.45);
            color: #ffffff;
        }

        .leaflet-container a.gmaps-nav-btn,
        .leaflet-container a.gmaps-nav-btn:hover,
        .leaflet-container a.gmaps-nav-btn:visited {
            color: #ffffff !important;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- 左側（手機版下方）：戰情統計儀表板與門店進度清單 -->
        <aside class="sidebar-wrapper shadow-xl">
            <!-- 1. 頂部標題列、權限鎖頭與同步控制 -->
            <div class="p-3 bg-slate-900 text-white shrink-0 border-b border-slate-800">
                <div class="flex items-center justify-between gap-1.5">
                    <div class="flex items-center gap-2 min-w-0">
                        <div class="w-10 h-10 rounded-xl bg-[#D90B17] border border-red-400/40 flex items-center justify-center shrink-0 shadow-md overflow-hidden" title="瓦城 THAI TOWN">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40" class="w-full h-full">
                                <rect width="100" height="100" fill="#D90B17"/>
                                <g fill="none" stroke="#FFFFFF" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M16 33 Q28 31 40 28"/>
                                    <path d="M23 33 L18 55 C17 61 21 63 26 59 L34 52"/>
                                    <path d="M20 43 C27 40 34 42 34 49 C34 56 38 61 45 59"/>
                                    <path d="M47 41 L57 39"/>
                                    <path d="M52 30 L52 55"/>
                                    <path d="M46 57 L58 51"/>
                                    <path d="M59 35 L82 31"/>
                                    <path d="M62 35 L61 48 C61 55 58 60 54 63"/>
                                    <path d="M62 45 L71 43 C73 43 73 46 72 51 C71 55 68 56 66 54"/>
                                    <path d="M67 24 C71 39 76 53 84 61"/>
                                    <path d="M83 41 C79 50 72 57 63 62"/>
                                </g>
                                <circle cx="26.5" cy="49.5" r="2.6" fill="#FFFFFF"/>
                                <circle cx="77" cy="23.5" r="3.2" fill="#FFFFFF"/>
                                <text x="50" y="79" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="13.5" letter-spacing="0.8">THAI TOWN</text>
                            </svg>
                        </div>
                        <div class="min-w-0">
                            <h1 class="text-sm font-extrabold tracking-tight truncate">瓦城年度巡檢戰情地圖 v1.8</h1>
                            <p id="today-date-label" class="text-[11px] text-slate-400 font-mono truncate">今日基準：載入中...</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button id="btn-sync-cloud" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition cursor-pointer" title="從 Google 試算表同步最新進度">
                            <svg id="sync-icon" xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                        </button>
                        <button id="btn-admin-toggle" class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-300 text-[11px] font-bold border border-slate-600 transition cursor-pointer" title="切換管理員編輯權限">
                            🔒 唯讀
                        </button>
                        <input type="file" id="input-import-csv" accept=".csv" class="hidden" />
                        <button id="btn-import-csv" class="hidden px-2 py-1.5 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white text-[11px] font-semibold border border-emerald-500/60 transition cursor-pointer" title="匯入 CSV 並寫入雲端資料庫">
                            匯入
                        </button>
                        <button id="btn-export-csv" class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-semibold border border-slate-700 transition cursor-pointer" title="匯出目前進度 CSV 報表">
                            匯出
                        </button>
                    </div>
                </div>

                <!-- 通知橫幅 -->
                <div id="toast-banner" class="hidden mt-2 px-3 py-1.5 rounded-lg text-[11px] font-bold flex items-center justify-between transition">
                    <span id="toast-message"></span>
                    <button onclick="document.getElementById('toast-banner').classList.add('hidden')" class="ml-2 opacity-75 hover:opacity-100 cursor-pointer">✕</button>
                </div>

                <!-- 2. 雙軌進度率統計條 -->
                <div class="mt-2.5 p-2.5 rounded-xl bg-slate-800/85 border border-slate-700/80 space-y-2">
                    <div id="group-complete-box" class="cursor-pointer rounded-lg p-1.5 -m-1 hover:bg-slate-700/50 transition" title="點擊在地圖上篩選所有已達成門店">
                        <div class="flex justify-between items-center text-[11px] mb-1">
                            <span class="text-slate-200 font-bold">已完成進度（已登錄 ＋ 已完成）</span>
                            <span id="stat-complete-rate" class="font-mono font-extrabold text-emerald-400">已完成率 0%</span>
                        </div>
                        <div class="w-full h-2.5 bg-slate-900/90 rounded-full overflow-hidden flex border border-slate-700/60">
                            <div id="bar-logged" class="h-full transition-all duration-300" style="width: 0%; background-color: #2563EB;" title="已線上登錄"></div>
                            <div id="bar-completed" class="h-full transition-all duration-300" style="width: 0%; background-color: #10B981;" title="已完成"></div>
                        </div>
                        <div id="sub-complete" class="text-[10px] text-slate-300 mt-1 flex items-center justify-between">
                            <span>計算中...</span>
                            <span class="text-slate-400 underline">篩選分布</span>
                        </div>
                    </div>

                    <div class="border-t border-slate-700/70"></div>

                    <div id="group-incomplete-box" class="cursor-pointer rounded-lg p-1.5 -m-1 hover:bg-slate-700/50 transition" title="點擊在地圖上篩選所有待完成門店">
                        <div class="flex justify-between items-center text-[11px] mb-1">
                            <span class="text-slate-200 font-bold">未完成進度（未排程 ＋ 今日排程）</span>
                            <span id="stat-incomplete-rate" class="font-mono font-extrabold text-amber-400">未完成率 0%</span>
                        </div>
                        <div class="w-full h-2.5 bg-slate-900/90 rounded-full overflow-hidden flex border border-slate-700/60">
                            <div id="bar-unscheduled" class="h-full transition-all duration-300" style="width: 0%; background-color: #64748B;" title="未排程"></div>
                            <div id="bar-today" class="h-full transition-all duration-300" style="width: 0%; background-color: #F59E0B;" title="今日排程"></div>
                        </div>
                        <div id="sub-incomplete" class="text-[10px] text-slate-300 mt-1 flex items-center justify-between">
                            <span>計算中...</span>
                            <span class="text-slate-400 underline">篩選分布</span>
                        </div>
                    </div>
                </div>

                <!-- 3. 四色進度燈號即時統計與篩選卡 -->
                <div class="grid grid-cols-4 gap-1.5 mt-2" id="status-filter-grid">
                    <button data-status="UNSCHEDULED" class="status-card p-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-center transition cursor-pointer">
                        <div class="flex items-center justify-center gap-1 text-[10px] text-slate-300 font-medium">
                            <span class="w-2 h-2 rounded-full bg-slate-400"></span>未排程
                        </div>
                        <div id="count-unscheduled" class="text-sm font-mono font-extrabold text-white mt-0.5">0</div>
                    </button>
                    <button data-status="TODAY" class="status-card p-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-amber-500/40 text-center transition cursor-pointer">
                        <div class="flex items-center justify-center gap-1 text-[10px] text-amber-300 font-bold">
                            <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>今日排程
                        </div>
                        <div id="count-today" class="text-sm font-mono font-extrabold text-amber-400 mt-0.5">0</div>
                    </button>
                    <button data-status="COMPLETED" class="status-card p-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-emerald-500/40 text-center transition cursor-pointer">
                        <div class="flex items-center justify-center gap-1 text-[10px] text-emerald-300 font-medium">
                            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>已完成
                        </div>
                        <div id="count-completed" class="text-sm font-mono font-extrabold text-emerald-400 mt-0.5">0</div>
                    </button>
                    <button data-status="LOGGED" class="status-card p-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-blue-500/40 text-center transition cursor-pointer">
                        <div class="flex items-center justify-center gap-1 text-[10px] text-blue-300 font-medium">
                            <span class="w-2 h-2 rounded-full bg-blue-400"></span>已登錄
                        </div>
                        <div id="count-logged" class="text-sm font-mono font-extrabold text-blue-400 mt-0.5">0</div>
                    </button>
                </div>

                <!-- 4. 搜尋框與行政區下拉篩選 -->
                <div class="grid grid-cols-5 gap-1.5 mt-2">
                    <div class="col-span-3 relative">
                        <input id="search-input" type="text" placeholder="搜尋店號或店名..."
                               class="w-full pl-7 pr-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500" />
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-slate-400 absolute left-2 top-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <select id="district-select" class="col-span-2 px-2 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white focus:outline-none focus:border-emerald-500 cursor-pointer">
                        <option value="ALL">全部行政區 (83)</option>
                    </select>
                </div>

                <!-- 5. 品牌快速篩選膠囊列 -->
                <div id="brand-filter-bar" class="flex items-center gap-1.5 mt-2 overflow-x-auto pb-0.5"></div>

                <!-- 篩選重置提示列 -->
                <div id="active-filter-bar" class="hidden mt-1.5 pt-1.5 border-t border-slate-800 flex items-center justify-between text-xs">
                    <span id="active-filter-text" class="text-amber-300 font-medium truncate">篩選中</span>
                    <button id="btn-clear-filter" class="text-slate-300 hover:text-white underline text-[11px] shrink-0 ml-2 cursor-pointer">顯示全部 (83)</button>
                </div>
            </div>

            <!-- 6. 門店進度卡片清單容器 -->
            <div id="store-list" class="flex-1 overflow-y-auto p-3 space-y-2.5 bg-slate-50"></div>

            <!-- 底部圖資與雲端同步狀態提示 -->
            <div class="px-3.5 py-2 bg-white border-t border-slate-200 text-[11px] text-slate-500 flex items-center justify-between shrink-0">
                <span>底圖：NLSC 臺灣通用電子地圖</span>
                <span id="save-indicator" class="text-emerald-600 font-semibold flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>連線同步就緒
                </span>
            </div>
        </aside>

        <!-- 右側（手機版上方）：互動地圖容器 -->
        <main class="map-wrapper">
            <div id="map"></div>

            <button id="btn-fit-bounds" class="absolute top-3 right-3 z-[1000] bg-slate-900/95 hover:bg-slate-800 text-white px-3.5 py-2 rounded-xl shadow-lg border border-slate-700 text-xs font-bold flex items-center gap-1.5 backdrop-blur-sm transition active:scale-95 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
                <span>總覽篩選門店</span>
            </button>

            <div class="hidden sm:flex absolute bottom-3 left-3 z-[1000] bg-white/95 backdrop-blur-sm px-3.5 py-2 rounded-xl shadow-md border border-slate-200 text-[11px] text-slate-700 items-center gap-3.5">
                <span class="font-bold text-slate-800">燈號圖例：</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-[#64748B]"></span>未排程</span>
                <span class="flex items-center gap-1 font-bold text-amber-700"><span class="w-2.5 h-2.5 rounded-full bg-[#F59E0B]"></span>今日排程</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-[#10B981]"></span>已完成</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-[#2563EB]"></span>已線上登錄</span>
            </div>
        </main>
    </div>

    <!-- 管理員密碼解鎖視窗 -->
    <div id="admin-modal" class="hidden fixed inset-0 z-[2000] bg-slate-900/65 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-xs p-5 space-y-3.5">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-extrabold text-slate-900 flex items-center gap-1.5">
                    <span>🔐</span>管理員權限驗證
                </h3>
                <button id="btn-close-admin-modal" class="text-slate-400 hover:text-slate-600 text-sm cursor-pointer">✕</button>
            </div>
            <p class="text-xs text-slate-600 leading-relaxed">
                目前為工程師唯讀檢視模式。輸入管理密碼解鎖後，可設定排程日期、切換進度狀態並寫入 Google 試算表。
            </p>
            <div>
                <input id="admin-password-input" type="password" placeholder="請輸入管理員密碼..."
                       class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs focus:outline-none focus:border-amber-500" />
                <p id="admin-error-msg" class="hidden text-[11px] text-rose-600 font-bold mt-1.5"></p>
            </div>
            <div class="flex items-center justify-end gap-2 pt-1">
                <button id="btn-cancel-admin" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold cursor-pointer">
                    取消
                </button>
                <button id="btn-verify-admin" class="px-3.5 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-extrabold shadow-sm cursor-pointer">
                    驗證並解鎖
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 系統基準設定與雲端資料庫 API 端點
        // ==========================================
        function getLocalTodayString() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        const TODAY_STR = getLocalTodayString();
        const API_URL = 'https://script.google.com/macros/s/AKfycbzxfyeptRFJ9eCXhRmmJl1OhuGbFCp4JXxkBX1nZRg3_OKBWkeGMdpfpRuyjEP-UNdN/exec';
        const STORAGE_KEY = 'thai_town_inspection_v1_8_83stores';
        const ADMIN_PWD_STORAGE_KEY = 'thai_town_admin_pwd_v1_8';
        const PREV_STORAGE_KEYS = [
            'thai_town_inspection_v1_7_83stores',
            'thai_town_inspection_v1_6_83stores',
            'thai_town_inspection_v1_5_83stores',
            'thai_town_inspection_v1_4_83stores',
            'thai_town_inspection_v1_3_83stores',
            'thai_town_inspection_v1_2_83stores'
        ];
        const WEEKDAY_LABELS = ['日', '一', '二', '三', '四', '五', '六'];

        let adminPassword = sessionStorage.getItem(ADMIN_PWD_STORAGE_KEY) || localStorage.getItem(ADMIN_PWD_STORAGE_KEY) || '';
        let isAdminMode = Boolean(adminPassword);

        // ==========================================
        // 2. 四色燈號視覺定義
        // ==========================================
        const STATUS_META = {
            UNSCHEDULED: {
                key: 'UNSCHEDULED',
